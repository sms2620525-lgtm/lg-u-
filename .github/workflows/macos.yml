name: Build macOS DMG
on:
  push:
    branches: [main]
    paths: ['*.py', '*.html', '*.js', '*.css', 'tests/**', 'build-macos.sh', '.github/workflows/macos.yml']
  workflow_dispatch:

permissions:
  contents: read

jobs:
  build:
    strategy:
      fail-fast: false
      matrix:
        os: [macos-15]
    runs-on: ${{ matrix.os }}
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'

      - run: python3 -m unittest discover -s tests
      - run: python3 tests/integration.py
      - run: bash build-macos.sh

      - name: Verify packaged setup, login and memory persistence
        run: python3 tests/integration.py --executable dist/JarvisCyber.app/Contents/MacOS/JarvisCyber
      - name: Verify DMG
        run: hdiutil verify dist/*.dmg

      - uses: actions/upload-artifact@v4
        with:
          name: JarvisCyber-${{ runner.arch }}
          path: dist/*.dmg
          if-no-files-found: error
