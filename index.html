<!doctype html>
<html lang="ko"><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>JARVIS · Mission Control</title>
<style>
:root{color-scheme:dark;font-family:system-ui,sans-serif;color:#e7f4ff;background:#060916}*{box-sizing:border-box}body{margin:0;min-height:100vh;background:radial-gradient(ellipse at 72% 20%,#19315380,transparent 45%),radial-gradient(ellipse at 15% 85%,#321e4880,transparent 40%),#060916}body:before{content:'';position:fixed;inset:0;pointer-events:none;background-image:radial-gradient(#b2d3ff99 1px,transparent 1px),radial-gradient(#fff6 1px,transparent 1px);background-size:93px 103px,157px 173px;background-position:10px 40px,80px 90px;opacity:.4}header,main{position:relative}header{padding:28px 5vw;border-bottom:1px solid #ffffff14;display:flex;justify-content:space-between;align-items:center}.brand{font-weight:700;letter-spacing:6px}.badge{font-size:12px;color:#8db5cf}main{max-width:1120px;margin:0 auto;padding:48px 24px;display:grid;grid-template-columns:1fr 1fr;gap:40px}.hero{padding:30px 0}.eyebrow{font-size:11px;letter-spacing:4px;color:#72e3ef}h1{font-size:48px;font-weight:400;letter-spacing:-2px;margin:16px 0}p{color:#9bb0c9;line-height:1.8}.orb{width:190px;height:190px;margin:42px auto;border:1px solid #61dfea77;border-radius:50%;display:grid;place-items:center;box-shadow:0 0 65px #44cddd22,inset 0 0 45px #258dc633}.orb:after{content:'';width:130px;height:130px;border-radius:50%;background:radial-gradient(circle at 35% 30%,#cdfbff,#38adcb 25%,#132f57 68%);box-shadow:0 0 40px #48d9f44d}.card{background:#10182bbb;border:1px solid #b0d4ff22;border-radius:20px;padding:25px;backdrop-filter:blur(12px);margin-bottom:20px}h2{font-size:18px;margin-top:0}textarea{width:100%;resize:vertical;min-height:105px;border:1px solid #ffffff22;background:#070e1b;border-radius:10px;padding:14px;color:#edf8ff;font:inherit;line-height:1.6}textarea:focus,button:focus-visible{outline:2px solid #70dbe7;outline-offset:3px}.actions{display:flex;gap:8px;flex-wrap:wrap;margin-top:12px}button{border:1px solid #ffffff25;border-radius:9px;background:#203044;color:#e9f5ff;padding:10px 14px;cursor:pointer;font:inherit;font-size:13px}.primary{background:#a3edf1;color:#092132;border:0}button:disabled{opacity:.5;cursor:wait}.memory{padding:16px 0;border-top:1px solid #ffffff14;display:flex;align-items:start;gap:12px}.memory span{flex:1;white-space:pre-wrap;overflow-wrap:anywhere;line-height:1.6}.memory button{font-size:11px;padding:6px 10px}.small{font-size:12px;color:#8aa4bd}#status{min-height:24px;color:#b1ecf1;font-size:13px;margin-top:14px}@media(max-width:750px){main{grid-template-columns:1fr;padding-top:10px;gap:5px}.hero{padding:20px 0}h1{font-size:37px}.orb{width:130px;height:130px;margin:25px auto}.orb:after{width:90px;height:90px}.badge{max-width:140px;text-align:right}}
</style>
<header><div class="brand">JARVIS</div><div class="badge">PERSONAL SPACE · 01</div></header>
<main><section class="hero"><div class="eyebrow">YOUR IDEAS, IN ORBIT</div><h1>상상을 시작하는 공간.</h1><p>떠오른 아이디어와 나에 대한 기억을 모으세요.<br>하나씩, 자비스를 만들어 갑니다.</p><div class="orb" aria-hidden="true"></div><div class="card"><h2>미션 상태</h2><p class="small">기억 저장 · 사용 가능<br>음성 · macOS 시스템 기본 음성<br>AI 대화 / ChatGPT 로그인 · 다음 단계<br>외부 DB 동기화 · 아직 연결되지 않음</p></div></section>
<section><div class="card"><h2>기억할 내용</h2><label for="input" class="small">소개, 선호하는 말투, 프로젝트 아이디어</label><textarea id="input" maxlength="2000" placeholder="자비스가 기억했으면 하는 내용을 적어 주세요."></textarea><div class="actions"><button class="primary" id="save">기억 저장</button><button id="speak">맥북 음성으로 읽기</button><button id="stop">음성 정지</button></div><div id="status" role="status" aria-live="polite"></div><p class="small">기억은 이 컴퓨터에 저장됩니다.</p></div><div class="card"><h2>내 기억 <span id="count" class="small"></span></h2><div id="memories"></div></div></section></main>
<script>
const token='__TOKEN__';const $=id=>document.getElementById(id);const status=t=>$('status').textContent=t;
async function api(path,body){const res=await fetch('/api/'+path,body===undefined?{}:{method:'POST',headers:{'Content-Type':'application/json','X-Jarvis-Token':token},body:JSON.stringify(body)});const data=await res.json();if(!res.ok)throw Error(data.error||'요청에 실패했어요.');return data;}
async function refresh(){const data=await api('memories');$('count').textContent=data.memories.length+'개';$('memories').replaceChildren();if(!data.memories.length){const p=document.createElement('p');p.className='small';p.textContent='첫 번째 기억을 남겨 주세요.';$('memories').append(p);}for(const m of data.memories){const row=document.createElement('div');row.className='memory';const text=document.createElement('span');text.textContent=m.text;const del=document.createElement('button');del.textContent='삭제';del.setAttribute('aria-label','기억 삭제');del.onclick=()=>run(del,async()=>{await api('delete',{id:m.id});await refresh();status('기억을 삭제했어요.');});row.append(text,del);$('memories').append(row);}if(!data.tts_available){$('speak').disabled=true;$('stop').disabled=true;status('음성 기능은 맥북에서 실행할 때 사용할 수 있어요.');}}
async function run(button,fn){button.disabled=true;try{await fn();}catch(e){status(e.message);}finally{button.disabled=false;}}
$('save').onclick=()=>run($('save'),async()=>{const text=$('input').value.trim();if(!text)throw Error('기억할 내용을 입력해 주세요.');await api('memories',{text});$('input').value='';await refresh();status('이 컴퓨터에 기억을 저장했어요.');});
$('speak').onclick=()=>run($('speak'),async()=>{const text=$('input').value.trim();if(!text)throw Error('읽을 내용을 입력해 주세요.');await api('speak',{text});status('맥북 기본 음성으로 읽고 있어요.');});
$('stop').onclick=()=>run($('stop'),async()=>{await api('stop',{});status('음성을 멈췄어요.');});refresh().catch(e=>status(e.message));
</script></html>
