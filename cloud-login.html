<!doctype html><html lang="ko"><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>JARVIS · Cloud Login</title><link rel="stylesheet" href="/cyber.css"><body style="min-height:100vh;display:grid;place-items:center"><main class="card" style="display:block;max-width:520px;width:90%;padding:36px"><span class="eyebrow">J.A.R.V.I.S. / CLOUD LINK</span><h1>내 저장소 연결</h1><p>이메일 인증 후 대화·기억·설정과 캐시를 Supabase에 저장합니다. GPT 대화 계정은 연결 후 별도로 로그인합니다.</p><form id="email-form"><label for="email">이메일</label><input id="email" type="email" autocomplete="email" required placeholder="프로젝트 소유자 이메일"><button id="send" class="primary">인증 메일 받기</button></form><form id="code-form" hidden><p>메일은 이 맥에서 열어 주세요. 앱을 종료하지 마세요.</p><label for="code">자동 복귀가 안 되면 인증 후 주소창의 주소 붙여넣기</label><input id="code" type="password" autocomplete="off" maxlength="4096" required><button id="verify" class="primary">연결</button></form><button id="resume" hidden>저장된 계정으로 계속</button><p id="message" role="status"></p><p class="small">로그인 세션은 macOS 키체인에 보관됩니다. 인터넷 연결이 필요합니다.</p></main><script>
let waiting=false,resuming=false,cooldown=0;
const token='__TOKEN__';const $=id=>document.getElementById(id);
async function post(path,body){const r=await fetch('/api/cloud/'+path,{method:'POST',headers:{'Content-Type':'application/json','X-Jarvis-Token':token},body:JSON.stringify(body)});const d=await r.json();if(!r.ok)throw Error(d.error);return d;}
async function action(button,fn){button.disabled=true;$('message').textContent='연결 중…';try{await fn();}catch(e){$('message').textContent=e.message;}finally{button.disabled=button.id==='send'&&cooldown>0;}}
$('email-form').onsubmit=e=>{e.preventDefault();action($('send'),async()=>{await post('otp',{email:$('email').value.trim()});waiting=true;cooldown=60;$('code-form').hidden=false;$('message').textContent='이 맥에서 최신 메일의 로그인 버튼을 누르세요. 인증하면 앱이 자동으로 연결됩니다.';});};
$('code-form').onsubmit=e=>{e.preventDefault();action($('verify'),async()=>{await post('verify',{code:$('code').value.trim()});$('code').value='';location.replace('/');});};
$('resume').onclick=()=>action($('resume'),async()=>{await post('resume',{});location.replace('/');});
async function poll(){try{const d=await (await fetch('/api/cloud/status')).json();cooldown=d.retry_after||0;$('send').disabled=cooldown>0;$('send').textContent=cooldown?'다시 보내기 · '+cooldown+'초':'인증 메일 받기';if(waiting&&d.error)$('message').textContent=d.error;if(waiting&&d.connected&&!d.pending&&!resuming){resuming=true;await post('resume',{});location.replace('/');}}catch(e){resuming=false;$('message').textContent=e.message;}setTimeout(poll,1500);}poll();
fetch('/api/cloud/status').then(r=>r.json()).then(d=>{if(d.connected){$('resume').hidden=false;$('resume').textContent=d.email+' 계정으로 계속';}}).catch(()=>{});
</script></body></html>
