<!doctype html><html lang="ko"><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>JARVIS · Cloud Login</title><link rel="stylesheet" href="/cyber.css"><body style="min-height:100vh;display:grid;place-items:center"><main class="card" style="display:block;max-width:520px;width:90%;padding:36px"><span class="eyebrow">J.A.R.V.I.S. / CLOUD LINK</span><h1>내 저장소 연결</h1><p>이메일 인증 후 대화·기억·설정과 캐시를 Supabase에 저장합니다. GPT 대화 계정은 연결 후 별도로 로그인합니다.</p><form id="email-form"><label for="email">이메일</label><input id="email" type="email" autocomplete="email" required placeholder="프로젝트 소유자 이메일"><button id="send" class="primary">인증 메일 받기</button></form><form id="code-form" hidden><label for="code">메일의 로그인 링크 또는 인증번호</label><input id="code" type="password" autocomplete="off" maxlength="4096" required><button id="verify" class="primary">연결</button></form><button id="resume" hidden>저장된 계정으로 계속</button><p id="message" role="status"></p><p class="small">로그인 세션은 macOS 키체인에 보관됩니다. 인터넷 연결이 필요합니다.</p></main><script>
const token='__TOKEN__';const $=id=>document.getElementById(id);
async function post(path,body){const r=await fetch('/api/cloud/'+path,{method:'POST',headers:{'Content-Type':'application/json','X-Jarvis-Token':token},body:JSON.stringify(body)});const d=await r.json();if(!r.ok)throw Error(d.error);return d;}
async function action(button,fn){button.disabled=true;$('message').textContent='연결 중…';try{await fn();}catch(e){$('message').textContent=e.message;}finally{button.disabled=false;}}
$('email-form').onsubmit=e=>{e.preventDefault();action($('send'),async()=>{await post('otp',{email:$('email').value.trim()});$('code-form').hidden=false;$('message').textContent='메일의 Sign in / Confirm 버튼을 길게 누르거나 우클릭해서 링크 주소를 복사해 붙여넣으세요. 링크를 먼저 열면 사용 완료될 수 있어요. 숫자 코드가 있으면 코드도 가능합니다.';$('code').focus();});};
$('code-form').onsubmit=e=>{e.preventDefault();action($('verify'),async()=>{await post('verify',{code:$('code').value.trim()});$('code').value='';location.replace('/');});};
$('resume').onclick=()=>action($('resume'),async()=>{await post('resume',{});location.replace('/');});
fetch('/api/cloud/status').then(r=>r.json()).then(d=>{if(d.connected){$('resume').hidden=false;$('resume').textContent=d.email+' 계정으로 계속';}}).catch(()=>{});
</script></body></html>
